# bolt.wrench-quality.yaml, the gate for wrench itself.
#
#     bolt wrench-quality .
#
# WHY THIS IS WRENCH'S OWN AND NOT THE SHARED JIGS. toolbox's bolt.*-std-quality
# files are still in the retired format: they carry `version: 1`, `id:`, `tags:`
# and `result_command:`, none of which wrench's own jig.schema.json accepts. So
# wrench cannot adopt them until those jigs are ported to the current schema,
# and waiting for that meant gating nothing at all.
#
# This runs a project's own checks in the meantime. It is not a substitute for
# the shared standard, and the destination is still four jig tasks, each
# language paired with common at its own base. Read that before extending this.
#
# ORDERED CHEAPEST FIRST, so a failure surfaces before the slow checks run.
#
# EVERY TASK BUT THE TWO COMPOSED ONES EXITS NON-ZERO ON ITS OWN FAILURE, which
# is deliberate: an adapter is a second thing to keep working, and `gofmt -l` is
# the only tool that would have needed one. `test -z` gives it an exit status
# instead.
#
# The exception is `python-common` and `python-std`, which run bolt over the
# Python pack's own base. bolt exits 0 whenever it carried a run out, so those
# two read the child's verdict through `adapters/common/bolt-result.py` and
# would otherwise pass however badly the child failed.

version: 1.0.0

requires: [go, gofmt, python3, jq, deno, bolt, mypy]

definitions:
  # A DIRECTORY, one file per requirement, nested by category. Both checkers
  # take either a file or a tree; wrench split its single REQUIREMENTS.md so
  # that retirement is carried by a filename rather than by a `## Retired`
  # heading whose switch reaches every row below it in the same file.
  requirements: docs/REQUIREMENTS

  # Output and artefact directories, which no analysis task may scan. None of
  # this is source: `.ephemera` is working files, the rest is build output that
  # a tool recreates whenever it runs.
  #
  # Scanning them turns the gate red for reasons unrelated to the code, and the
  # message names the artefact rather than the cause. Measured here: a scratch
  # `.go` file under `.ephemera` fails `go-format`, and a stale `python/build/`
  # gives mypy a duplicate module and pylint a duplicate-code hit, three red
  # tasks between them and nothing wrong with the repository.
  #
  # Go's own `./...` already skips a directory whose name begins with a dot, so
  # `go vet` and `go test` need nothing. `gofmt` is a plain file walk and does.
  #
  # Every dot-directory, anything named for a cache, and the four output names.
  # Stated as a class rather than a list of the ones that have bitten, because
  # the next tool brings its own directory and naming it after the fact means
  # meeting the failure first.
  artefacts_regex: (^|/)(\.[^/]+|build|dist|out|target|[^/]*cache[^/]*|[^/]+\.egg-info)/

tasks:
  # ---- the structured files this project exists to define --------------------

  # Cheapest and most specific to wrench: the schemas are the product, so they
  # are checked before anything that merely uses them.

  - name: json-parses
    description: every JSON file is JSON
    command: jq empty {each_path}
    matching: ["**/*.json"]
    excluding: [".ephemera/**", "**/node_modules/**"]

  - name: json-formatted
    description: every JSON file is formatted, and formatting preserves how it was written
    # deno rather than `jq --indent 2`, which is a processor and not a formatter:
    # it strips the blank lines grouping a schema and explodes short inline
    # arrays, so enforcing it would make a hand-written schema worse. Measured
    # 2026-08-27.
    command: deno fmt --check {each_path}
    matching: ["**/*.json"]
    excluding: [".ephemera/**", "**/node_modules/**"]

  - name: schema-declares-its-dialect-and-id
    description: a shipped schema says which JSON Schema it is and what it is called
    # The $id is what a schema is named by in an error and what another schema
    # references it by. A shipped schema without one cannot be referenced and
    # puts a local path into evidence that travels.
    command: jq -e 'has("$schema") and has("$id")' {each_path} > /dev/null
    matching: ["schemas/*.schema.json"]

  - name: schema-valid-by-an-independent-implementation
    description: the shipped schemas are valid 2020-12 according to something that is not wrench
    # THE WHOLE POINT IS THAT THIS IS NOT WRENCH. Both packs compiling their own
    # schemas cannot catch both bindings misreading the specification the same
    # way, and nothing outside wrench had ever read these files.
    #
    # ajv, in JavaScript, which no pack binds. The rule is that a pack and the
    # gate's independent validator may never bind the same library: Go's
    # santhosh-tekuri, Python's jsonschema and Rust's jsonschema crate are all
    # already ours.
    #
    # This is one implementation, and one is not the shape the check ends up.
    # The gate asks every validator wrench binds and requires them to agree,
    # plus at least one implementation no pack binds, so unanimity cannot
    # quietly become unanimity among wrench's own bindings. The rest of that is
    # unwritten, so ajv is the only implementation asked today. The argument is
    # in docs/DECISIONS/the-gate-asks-every-validator-and-requires-agreement.md,
    # and asking a second independent implementation is the remaining work.
    #
    # Run through deno, which is installed and declared, so this needs no global
    # npm install and no package.json in a repository that has no JavaScript.
    # deno caches the package, so only a cold cache reaches the network.
    #
    # Not `jq` or `yq`: both are processors, not validators. Measured 2026-08-27,
    # `jq -n 'builtins | map(select(test("schema")))'` returns [].
    #
    # bin/check-schemas.ts rather than ajv-cli. The library is first class, at
    # 377 million downloads a week and released 2026-04-24. Its CLI is not:
    # ajv-cli 5.0.0 was last released 2023-04-28. Fifteen lines here beats a
    # three-year-stale wrapper, and reading schemas/ as a directory means a fifth
    # schema is checked without editing anything.
    command: deno run --allow-read --allow-net bin/check-schemas.ts

  # ---- the packs ------------------------------------------------------------

  - name: go-format
    description: every Go file is gofmt-clean
    # gofmt -l lists unformatted files and exits 0 either way, so its exit status
    # answers "did gofmt run" and never "is this formatted". test -z makes the
    # empty list the success condition.
    # No quotes around the placeholder: bolt shell-quotes a substituted value,
    # so adding a pair produces '' and sh fails to parse the line.
    command: test -z "$(gofmt -l go | grep -Ev {artefacts_regex} || true)"

  - name: go-vet
    command: cd go && go vet ./...

  - name: go-test
    description: the Go pack, uncached
    command: cd go && go test -count=1 ./...

  - name: python-test
    description: the Python pack, run from the repository root so it finds schemas/
    command: PYTHONPATH=python python3 -m pytest python/tests -q

  - name: rust-test
    description: the Rust pack, which bolt builds against
    command: cargo test --manifest-path rust/Cargo.toml

  - name: rust-format
    description: every Rust file is rustfmt-clean
    # Go and Python were format-gated and Rust was not, so the pack drifted to
    # 33 diffs across 8 files without anything saying so. cargo fmt --check
    # exits non-zero on a diff, unlike gofmt -l, so its status is the answer.
    command: cargo fmt --manifest-path rust/Cargo.toml --check

  # ---- the shared standard, per pack at its own base -----------------------
  #
  # The Go and Python packs each have a base of their own. Rust has no shared
  # standard yet.
  #
  # COMPOSITION IS A COMMAND TASK PLUS AN ADAPTER. Nested `jig:` tasks are
  # retired at bolt `f3304d8`, so a jig wanting another jig run over a
  # subdirectory writes an ordinary command whose program is bolt.
  #
  # `adapters/common/bolt-result.py` is what makes that a verdict rather than a
  # transcript. bolt exits 0 whenever it carried a run out, so the generic
  # exit-code adapter reads a failing child as a pass: measured by toolbox on
  # one failing child, `success=True` without the adapter and `success=False`
  # with it.
  #
  # THREE THINGS EACH COST A RUN TO LEARN. Flags come before positionals, or
  # bolt prints usage to stderr and the task fails as a bolt error rather than
  # as anything about the jig. The child gets `{work_dir}/child` of its own,
  # because bolt refuses a directory already holding a run and the Go build
  # rewrites the earlier verdict while refusing. And the adapter reads the LAST
  # line of the child's stdout, which is the result path under both builds.

  - name: python-common
    description: the shared common standard, at the Python pack's own base
    command: >-
      bolt --config-dir {config_dir} --definitions wrench
      --output-dir {work_dir}/child common-quality python
    adapter: adapters/common/bolt-result.py

  - name: python-std
    description: ruff, mypy, pylint, complexipy, vulture, docstrings and coverage
    command: >-
      bolt --config-dir {config_dir}
      --output-dir {work_dir}/child python-std-quality python
    adapter: adapters/common/bolt-result.py

  # ---- the contract ---------------------------------------------------------

  - name: traceability
    description: every test cites what it discharges, and every settled requirement has one
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} .

  # A requirement the traceability checker cannot PARSE is absent from its
  # denominator rather than reported missing, so the run passes cleanly over a
  # contract with a hole in it. Measured 2026-08-29: a well-formed file with a
  # two-letter suffix left the output at `41 of 41` and exit 0, identical to not
  # adding it at all.
  #
  # This compares the files on disk against what the checker managed to read, so
  # it does not depend on the id grammar and catches whatever the next
  # unparseable row turns out to be. The idea is the bolt session's.
  - name: requirement-count
    description: every live requirement file reaches the traceability checker
    command: python3 {config_dir}/bin/test-requirement-count.py

  # `python-common` ABOVE ALREADY RUNS THE SUPPRESSION REGISTER, and at base
  # `python/`, so `bin/`, the Go pack and the Rust pack are outside its scan by
  # construction. Measured 2026-08-29: that run reads 9 files, and a `//nolint`
  # written into a Go file at the root passes it at exit 0.
  #
  # This runs the same checker over the whole tree, 41 files. It is the gate's
  # half of hard rule 4; `bin/githooks/pre-commit` is the other half and refuses
  # the commit rather than waiting for somebody to run the gate.
  - name: suppressions-everywhere
    description: no suppression pragma in any language that SUPPRESSIONS misses
    command: python3 {config_dir}/bin/no-unregistered-suppression.py

  - name: consumer-types
    description: the pack is annotated under --strict and a consumer of the install resolves it
    # py.typed asserts that a consumer type-checking its own code gets types
    # from wrench. The marker landed while the public API carried no
    # annotations, so the pack asserted something it did not meet and a strict
    # consumer traded `cannot find wrench` for `wrench is untyped in 22 places`.
    #
    # Two halves, because either alone passes in that state. The checker's own
    # docstring carries why the consumer half has to run against an install
    # rather than against the source tree.
    command: python3 {config_dir}/bin/check-consumer-types.py

  - name: shipped-schemas-are-current
    description: the Go and Python packs carry byte for byte what schemas/ holds
    # The Go and Python packs carry the schemas as generated source, so each is
    # a second copy of every schema and FR-3.2 exists to stop exactly that
    # drifting. This is what makes the copy safe: edit a schema without
    # regenerating and the gate says which file is stale.
    #
    # Rust is absent on purpose. `rust/build.rs` regenerates on every build, so
    # its copy cannot be stale and there is nothing here to check.
    command: python3 {config_dir}/bin/generate-shipped.py --check

  # `retired-rows-are-deliberate` STOOD HERE AND IS GONE, at the split. It
  # pinned the count of rows below `## Retired` in a single REQUIREMENTS.md,
  # because that heading was the file's last section and a row appended to the
  # end was silently retired rather than added. Retirement is now carried by a
  # filename, so there is no heading, no switch and no below-this-line, and the
  # hazard is gone by construction rather than watched by a number somebody has
  # to remember to edit.

  - name: suite-parity
    description: every pack's suite covers the same tests
    # Compares the suites AGAINST EACH OTHER, so it stands at the root and cannot
    # become a per-language task. Adding a pack means adding a --suite here.
    command: ./bin/test-suite-parity.py --requirements {requirements} --suite go='go/*_test.go' --suite python='python/tests/*.py' --suite rust='rust/tests/*.rs' .

  # THE CHECKER ABOVE IS THE ONE THING NOTHING ELSE CHECKS. It decides whether
  # three suites agree, and until 2026-08-28 it could report `exit 0` on a real
  # divergence: it split its requirements text at the first `## Retired` and
  # treated the rest of the file as gone, where test-traceability.py resets at
  # every heading. Same file, two answers, and the pass came from this side.
  #
  # WHY THE TESTS ARE UNDER testdata/ AND NOT BESIDE A SUITE. They must contain
  # `COVERS:` marks as fixture data, and this checker greps that string out of
  # every file matching a suite glob. Measured: a file in a python suite whose
  # only mention of FR-9.2 was inside a string turned a reported divergence into
  # a pass. `testdata/` is in test-traceability.py's SKIP_DIRS and matches no
  # suite glob, so it is the one directory both checkers ignore.
  #
  # Run explicitly by path because that is not a directory pytest would find.
  - name: checker-tests
    description: wrench's own parity checker does what it claims
    command: python3 -m pytest testdata/checkers -q
