# bolt.wrench-quality.yaml, the gate for wrench itself.
#
#     bolt wrench-quality .
#
# WHY THIS IS WRENCH'S OWN AND NOT THE SHARED JIGS. toolbox's bolt.*-std-quality
# files are still in the retired format: they carry `version: 1`, `id:`, `tags:`
# and `result_command:`, none of which wrench's own jig.schema.json accepts. So
# wrench cannot adopt them until `clank/tasks/toolbox/port-the-jigs` lands, and
# waiting for that meant gating nothing at all.
#
# This runs a project's own checks in the meantime. It is not a substitute for
# the shared standard, and `clank/tasks/wrench/gate/10-a-composite-jig` is still
# the destination: four jig tasks, each language paired with common at its own
# base. Read that before extending this.
#
# ORDERED CHEAPEST FIRST, so a failure surfaces before the slow checks run.
#
# EVERY TASK EXITS NON-ZERO ON ITS OWN FAILURE. Nothing here needs an adapter to
# turn output into a verdict, which is deliberate: an adapter is a second thing
# to keep working, and `gofmt -l` is the only tool that would have needed one.
# `test -z` gives it an exit status instead.

version: 1.0.0

requires: [go, gofmt, python3, jq, deno, bolt]

definitions:
  requirements: REQUIREMENTS.md

tasks:
  # ---- the structured files this project exists to define --------------------

  # Cheapest and most specific to wrench: the schemas are the product, so they
  # are checked before anything that merely uses them.

  - name: json-parses
    description: every JSON file is JSON
    command: jq empty {each_path}
    matching: ["**/*.json"]
    excluding: [".ephemera/**", "**/node_modules/**"]

  - name: json-formatted
    description: every JSON file is formatted, and formatting preserves how it was written
    # deno rather than `jq --indent 2`, which is a processor and not a formatter:
    # it strips the blank lines grouping a schema and explodes short inline
    # arrays, so enforcing it would make a hand-written schema worse. Measured
    # 2026-08-27.
    command: deno fmt --check {each_path}
    matching: ["**/*.json"]
    excluding: [".ephemera/**", "**/node_modules/**"]

  - name: schema-declares-its-dialect-and-id
    description: a shipped schema says which JSON Schema it is and what it is called
    # The $id is what a schema is named by in an error and what another schema
    # references it by. A shipped schema without one cannot be referenced and
    # puts a local path into evidence that travels.
    command: jq -e 'has("$schema") and has("$id")' {each_path} > /dev/null
    matching: ["schemas/*.schema.json"]

  - name: schema-valid-by-an-independent-implementation
    description: the shipped schemas are valid 2020-12 according to something that is not wrench
    # THE WHOLE POINT IS THAT THIS IS NOT WRENCH. Both packs compiling their own
    # schemas cannot catch both bindings misreading the specification the same
    # way, and nothing outside wrench had ever read these files.
    #
    # ajv, in JavaScript. The rule is that the gate's validator must not be a
    # library any pack binds: Go's santhosh-tekuri and Python's jsonschema are
    # already ours, and a Rust pack would take boon.
    #
    # ADDING TYPESCRIPT PUTS THIS AT RISK. A TypeScript pack would naturally bind
    # ajv, and the gate would then be asking one of wrench's own bindings. It has
    # to move to another implementation before that pack is written, and
    # @hyperjump/json-schema is the measured alternative. See
    # clank/tasks/wrench/schemas/50-typescript-binds-the-validator-the-gate-uses.
    #
    # Run through deno, which is installed and declared, so this needs no global
    # npm install and no package.json in a repository that has no JavaScript.
    # deno caches the package, so only a cold cache reaches the network.
    #
    # Not `jq` or `yq`: both are processors, not validators. Measured 2026-08-27,
    # `jq -n 'builtins | map(select(test("schema")))'` returns [].
    #
    # bin/check-schemas.ts rather than ajv-cli. The library is first class, at
    # 377 million downloads a week and released 2026-04-24. Its CLI is not:
    # ajv-cli 5.0.0 was last released 2023-04-28. Fifteen lines here beats a
    # three-year-stale wrapper, and reading schemas/ as a directory means a fifth
    # schema is checked without editing anything.
    command: deno run --allow-read --allow-net bin/check-schemas.ts

  # ---- the packs ------------------------------------------------------------

  - name: go-format
    description: every Go file is gofmt-clean
    # gofmt -l lists unformatted files and exits 0 either way, so its exit status
    # answers "did gofmt run" and never "is this formatted". test -z makes the
    # empty list the success condition.
    command: test -z "$(gofmt -l .)"

  - name: go-vet
    command: go vet ./...

  - name: go-test
    description: the Go pack, uncached
    command: go test -count=1 ./...

  - name: python-test
    description: the Python pack, run from the repository root so it finds schemas/
    command: PYTHONPATH=python python3 -m pytest python/tests -q

  - name: rust-test
    description: the Rust pack, which bolt builds against
    command: cargo test --manifest-path rust/Cargo.toml

  # ---- the contract ---------------------------------------------------------

  - name: traceability
    description: every test cites what it discharges, and every settled requirement has one
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} .

  - name: suite-parity
    description: every pack's suite covers the same tests
    # Compares the suites AGAINST EACH OTHER, so it stands at the root and cannot
    # become a per-language task. Adding a pack means adding a --suite here.
    command: ./bin/test-suite-parity.py --requirements {requirements} --suite go='*_test.go' --suite python='python/tests/*.py' .
