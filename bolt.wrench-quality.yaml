# bolt.wrench-quality.yaml, the gate for wrench itself.
#
#     bolt wrench-quality .
#
# wrench has its own gate because toolbox's bolt.*-std-quality files are still
# in the retired format: they carry `version: 1`, `id:`, `tags:` and
# `result_command:`, none of which wrench's own jig.schema.json accepts. wrench
# cannot adopt them until those jigs are ported to the current schema, and
# waiting would have meant gating nothing.
#
# This runs the project's own checks in the meantime. It does not replace the
# shared standard, and the destination is still four jig tasks, each language
# paired with common at its own base. Keep that in mind before extending this.
#
# Tasks are ordered cheapest first, so a failure surfaces before the slow checks
# run.
#
# Every task but the two composed ones exits non-zero on its own failure. That
# is deliberate: an adapter is a second thing to keep working, and `gofmt -l` is
# the only tool that would have needed one. `test -z` gives it an exit status
# instead.
#
# This jig is the contract layer and holds no pack's tooling. `just checks` at
# the root runs each pack's own checks first, each at its own base, and then
# this. A pack's build directory, coverage profile and caches stay inside it.

version: 1.0.0

# Every tool a task here invokes, so a missing one stops the run before it
# starts instead of several tasks in. `uv` is here because the checkers that
# type-check the consumer use the Python pack's declared environment rather than
# whatever is installed globally.
#
# No pack's tooling. A language's toolchain is named in that pack's own jig,
# reached through its own Justfile, so a machine missing one pack's compiler or
# runtime still runs the contract over the schemas and the requirements.
requires: [python3, jq, deno, mypy, uv]

definitions:
  # A directory, one file per requirement, nested by category. Both checkers
  # take either a file or a tree. One file per requirement means retirement is
  # carried by a filename, where a `## Retired` heading in a single file would
  # silently retire every row below it.
  requirements: docs/REQUIREMENTS

  # Output and artefact directories, which no analysis task may scan. None of
  # this is source: `.ephemera` is working files, the rest is build output that
  # a tool recreates whenever it runs.
  #
  # Scanning them turns the gate red for reasons unrelated to the code, and the
  # message names the artefact instead of the cause. A scratch `.go` file under
  # `.ephemera` fails `go-format`, and a stale `python/build/` gives mypy a
  # duplicate module and pylint a duplicate-code hit: three red tasks and
  # nothing wrong with the repository.
  #
  # Go's own `./...` already skips a directory whose name begins with a dot, so
  # `go vet` and `go test` need nothing. `gofmt` is a plain file walk and does.
  #
  # Every dot-directory, anything named for a cache, and the four output names.
  # It is written as a class and not as a list of the ones that have bitten,
  # because the next tool brings its own directory.
  artefacts_regex: (^|/)(\.[^/]+|build|dist|out|target|[^/]*cache[^/]*|[^/]+\.egg-info)/

tasks:
  # ---- the structured files this project exists to define --------------------

  # Cheapest and most specific to wrench: the schemas are the product, so they
  # are checked before anything that merely uses them.

  - name: json-parses
    description: every JSON file is JSON
    command: jq empty {each_path}
    matching: ["**/*.json"]
    excluding: [".ephemera/**", "**/node_modules/**"]

  - name: json-formatted
    description: every JSON file is formatted, and formatting preserves how it was written
    # deno and not `jq --indent 2`, which is a processor and not a formatter:
    # it strips the blank lines grouping a schema and explodes short inline
    # arrays, so enforcing it would make a hand-written schema worse.
    command: deno fmt --check {each_path}
    matching: ["**/*.json"]
    excluding: [".ephemera/**", "**/node_modules/**"]

  - name: schema-declares-its-dialect-and-id
    description: a shipped schema says which JSON Schema it is and what it is called
    # The $id is what a schema is named by in an error and what another schema
    # references it by. A shipped schema without one cannot be referenced and
    # puts a local path into evidence that travels.
    command: jq -e 'has("$schema") and has("$id")' {each_path} > /dev/null
    matching: ["schemas/*.schema.json"]

  - name: schema-valid-by-an-independent-implementation
    description: the shipped schemas are valid 2020-12 according to something that is not wrench
    # The validator here must not be wrench. The packs compiling their own
    # schemas cannot catch every binding misreading the specification the same
    # way.
    #
    # ajv, in JavaScript, which no pack binds. A pack and the gate's independent
    # validator may never bind the same library: Go's santhosh-tekuri, Python's
    # jsonschema and Rust's jsonschema crate are all already wrench's.
    #
    # The intended check asks every validator wrench binds, requires them to
    # agree, and adds at least one implementation no pack binds, so unanimity
    # cannot quietly become unanimity among wrench's own bindings. Only ajv is
    # asked so far; a second independent implementation is the remaining work.
    # The argument is in
    # docs/DECISIONS/the-gate-asks-every-validator-and-requires-agreement.md.
    #
    # Run through deno, which is installed and declared, so this needs no global
    # npm install and no package.json. deno caches the package, so only a cold
    # cache reaches the network.
    #
    # Not `jq` or `yq`: both are processors, not validators, and
    # `jq -n 'builtins | map(select(test("schema")))'` returns [].
    #
    # bin/check-schemas.ts and not ajv-cli. The library is actively maintained,
    # at 377 million downloads a week and released 2026-04-24. Its CLI is not:
    # ajv-cli 5.0.0 was last released 2023-04-28. Fifteen lines here beat a
    # three-year-stale wrapper, and reading schemas/ as a directory means a new
    # schema is checked without editing anything.
    command: deno run --allow-read --allow-net bin/check-schemas.ts

  # ---- no pack tasks live here ----------------------------------------------
  #
  # A pack's own tooling runs at that pack's base, through its own Justfile, and
  # this jig does not reach into one. `just checks` at the root iterates the
  # packs and then runs this.
  #
  # That is not tidiness. Running a pack's tools from here put their artefacts
  # at the root: `gofmt -l go` walked a tree Go's own `./...` would have skipped,
  # and `pytest python/tests` wrote `.coverage` at the root beside
  # `python/.coverage`. One language's leavings being graded as another's is what
  # the split removes, and it is why `.gitignore` carried two `.coverage` paths.
  #
  # What each pack runs is in `<pack>/just/lang.just`: go-std-quality,
  # python-std-quality, node-std-quality, and Rust's cargo tasks until a shared
  # Rust standard is adopted.

  # ---- the contract ---------------------------------------------------------

  # The whole-repository traceability run is the common standard's, which `just
  # checks` runs here at the root. What is left here is the half it cannot do.
  #
  # One task per pack. A run over the repository asks whether an id is cited
  # anywhere under it, so a row covered in Go alone passes, and a pack holding
  # none of a requirement goes unseen.
  # `suite-parity` catches that by comparing the suites to each other, which
  # leaves its own gap: three packs that all miss the same row agree, and
  # agreement is what it checks.
  #
  # A scoped run closes both. Each pack is held to the requirements themselves,
  # not to the union of its siblings or to their agreement, and the envelope
  # carries a verdict per pack instead of one that could have come from any of
  # them.
  #
  # `--scope` holds a tree to the rows naming it plus the rows naming no tree,
  # so the three lowercase markers under `reaching-the-library/` are this run's
  # business in Python and nobody else's. It reads the row half of the same
  # clause `test-suite-parity.py` reads for kinds; neither holds a second copy
  # of which rows are exempt.
  # The name and the path are two arguments, not one written twice. `--scope go`
  # says which rows this run is held to; `--dir ./go` says which tree to read.
  # They match here only because wrench's packs sit in directories named after
  # its suites: a pack under `packs/go/` would read `--scope go --dir packs/go`.
  #
  # The path is passed by name for that reason. `--scope go go` is correct but
  # reads as one word repeated. The positional still works and the root task
  # above still uses it.
  - name: traceability-go
    description: the Go pack covers every requirement it is expected to
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} --scope go --dir ./go

  - name: traceability-python
    description: the Python pack covers every requirement it is expected to
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} --scope python --dir ./python

  - name: traceability-rust
    description: the Rust pack covers every requirement it is expected to
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} --scope rust --dir ./rust

  # A requirement the traceability checker cannot parse is left out of its
  # denominator instead of reported missing, so the run passes cleanly over a
  # contract with a hole in it. A well-formed file with a two-letter suffix left
  # the output at `41 of 41` and exit 0, identical to not adding it at all.
  #
  # This compares the files on disk against what the checker managed to read, so
  # it does not depend on the id grammar and catches whatever the next
  # unparseable row turns out to be. The idea comes from bolt.
  - name: requirement-count
    description: every live requirement file reaches the traceability checker
    command: python3 {config_dir}/bin/test-requirement-count.py

  # `python-common` above already runs the suppression register, but at base
  # `python/`, so `bin/`, the Go pack and the Rust pack are outside its scan.
  # That run reads 9 files, and a `//nolint` written into a Go file at the root
  # passes it at exit 0.
  #
  # This runs the same checker over the whole tree, 41 files. It is the gate's
  # half of hard rule 4; `bin/githooks/pre-commit` is the other half and refuses
  # the commit without waiting for somebody to run the gate.
  - name: suppressions-everywhere
    description: no suppression pragma in any language that SUPPRESSIONS misses
    command: python3 {config_dir}/bin/no-unregistered-suppression.py

  - name: consumer-types
    description: the pack is annotated under --strict and a consumer of the install resolves it
    # py.typed asserts that a consumer type-checking its own code gets types
    # from wrench. The marker landed while the public API carried no
    # annotations, so the pack asserted something it did not meet and a strict
    # consumer traded `cannot find wrench` for `wrench is untyped in 22 places`.
    #
    # Two halves, because either alone passes in that state. The checker's own
    # docstring says why the consumer half has to run against an install and
    # not against the source tree.
    #
    # Through `uv run --project python` so the `mypy` this invokes is the pack's,
    # with `types-PyYAML`, `types-jsonschema` and `referencing` resolvable. A
    # mypy from PATH reports six errors about libraries and none about wrench.
    command: uv run --project python python3 {config_dir}/bin/check-consumer-types.py

  - name: shipped-schemas-are-current
    description: the Go and Python packs carry byte for byte what schemas/ holds
    # The Go and Python packs carry the schemas as generated source, so each is
    # a second copy of every schema, and FR-3.2 forbids that copy drifting.
    # Edit a schema without regenerating and this task says which file is
    # stale.
    #
    # Rust is absent on purpose. `rust/build.rs` regenerates on every build, so
    # its copy cannot be stale and there is nothing here to check.
    command: python3 {config_dir}/bin/generate-shipped.py --check

  # No task counts retired rows. With retirement carried by a filename there is
  # no `## Retired` heading for an appended row to fall under by accident.

  - name: suite-parity
    description: every pack's suite covers the same tests
    # Compares the suites against each other, so it stands at the root and
    # cannot become a per-language task. Adding a pack means adding a --suite
    # here.
    #
    # TypeScript is absent on purpose and not by omission: it is not yet in any
    # of the three mechanisms that hold packs level, and `NEXT_STEPS.md` carries
    # what adding it reported.
    command: ./bin/test-suite-parity.py --requirements {requirements} --suite go='go/*_test.go' --suite python='python/tests/*.py' --suite rust='rust/tests/*.rs' .

  # Nothing else checks the checker above. It decides whether three suites
  # agree, and it once reported `exit 0` on a real divergence by splitting its
  # requirements text at the first `## Retired` and treating the rest of the
  # file as gone, where test-traceability.py resets at every heading. These
  # tests keep the two reading a file the same way.
  #
  # The tests live under testdata/ and not beside a suite because they contain
  # `COVERS:` marks as fixture data, and this checker greps that string out of
  # every file matching a suite glob. A file in a python suite whose only
  # mention of FR-9.2 was inside a string turned a reported divergence into a
  # pass. `testdata/` is in test-traceability.py's SKIP_DIRS and matches no
  # suite glob, so it is the one directory both checkers ignore.
  #
  # Run explicitly by path because pytest would not find that directory.
  # `--no-project` because these tests import the standard library and nothing
  # else (they drive the checkers as subprocesses), so the pack's environment
  # would be the wrong one and the root has no project of its own.
  - name: checker-tests
    description: wrench's own parity checker does what it claims
    command: uv run --no-project --with pytest python -m pytest testdata/checkers -q
