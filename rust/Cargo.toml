[package]
name = "wrench"
version = "0.4.0"

# Edition 2021 is held on purpose. Edition 2024 builds under the 1.97 floor
# declared below, so nothing about the toolchain keeps this at 2021, and the
# difference from bolt (on 2024 under the same floor) is deliberate. An edition
# states what the code means, not which compiler builds it, so moving is a
# decision of its own and that decision has not been made.
edition = "2021"

rust-version = "1.97"
license = "Apache-2.0"
description = "Reads, writes and validates the form of the ecosystem's structured files"

[dependencies]

# The value type is the contract. FR-2.9 says a decoder produces maps, lists and
# JSON scalars and nothing else, and serde_json::Value is that shape in Rust. It
# is also jsonschema's native input, so nothing converts between validating and
# returning, and a caller wanting its own struct writes serde_json::from_value
# instead of walking maps by hand.
serde_json = "1"

# The trait only, not the derive. FR-4.8 needs the JSON codec to spell a
# float the way the YAML codec does, and serde_json's hook for that is a
# custom Formatter driven through `Serialize`. Naming that trait needs serde as
# a direct dependency; serde_json already pulls it in, so nothing new is built.
#
# `derive` stays a dev-dependency. The pack still hands back serde_json::Value
# and has no opinion about a caller's structs.
serde = "1"

# Default features are off. From the crate's metadata:
#     default      -> ["resolve-http", "resolve-file", "tls-aws-lc-rs", "idna"]
#     resolve-http -> ["reqwest", "dep:rustls"]
#
# So the default build resolves $refs over HTTP and off the filesystem, and links
# a whole HTTP client and TLS stack to do it. Turning them off keeps that out of
# every consumer's build. It does not discharge FR-3.10: Cargo unifies features
# across the dependency graph, so another crate can switch them back on. The
# refusing retriever in src/schema.rs does that, whatever features are on. See
# docs/DECISIONS/which-json-schema-library-each-pack-binds.md.
#
# Chosen over boon on its record: released 2026-08-26 against 2025-01-07, and
# 84 million downloads against 458 thousand.
jsonschema = { version = "0.52", default-features = false }

# Rust's YAML situation is bad and this is the maintained way through it.
# serde_yaml is deprecated in its own version string, serde_yml says DEPRECATED
# and unmaintained in its own description, and serde_norway was last touched in
# 2024. yaml-rust2 is YAML 1.2 compliant, has 53 million downloads, and is
# actively maintained.
#
# The parser only. Its emitter cannot be used: it quotes what its own private
# `need_quotes` decides, spells null `~`, and writes BEL, ESC, DEL, U+0085,
# U+2028 and U+2029 raw, which FR-4.9 forbids. Neither it nor `saphyr`, the
# same emitter behind a different name, exposes a hook to change any of that.
yaml-rust2 = "0.12"

# The emitter: libyaml's binding, and the only maintained Rust crate whose
# emitter takes the scalar style per node, which is the quoting adapter and the
# thing that makes an emitter removable. Its escape table already matches this
# pack's exactly, `\0 \a \b \t \n \v \f \r \e \N \L \P`, uppercase `\x7F` and
# `﻿`, and it leaves U+00A0 raw as every other pack does.
#
# It writes block sequences without indenting them under their key, hard-coded
# at `emitter.rs:732` with no setting. That is why this pack's output is not
# byte-identical to Go's and Python's, and why FR-5.5 asks for structural
# agreement instead of identical bytes.
libyaml-safer = "0.3"

# FR-2.6 needs a distinct error per step, and bolt's FR-6.11 is unimplementable
# if parse and validate collapse into one type.
thiserror = "2"

[dev-dependencies]

# For the documented example only. The pack itself does not depend on serde's
# derive: it hands back serde_json::Value and a caller deserialises if it wants
# to. The example compiles, so that claim is checked.
serde = { version = "1", features = ["derive"] }

# FR-2.2 says nothing reads or writes without naming what the file must conform
# to. Go and Python discharge that with a runtime test passing nil or None; this
# pack takes &dyn Schema, &dyn Codec and &dyn Reader, so the same call does not
# compile and there is no runtime refusal to observe.
#
# trybuild runs the compiler on a file that is meant to fail and asserts it did,
# comparing stderr against a checked-in expectation. That turns a guarantee which
# would otherwise live only in the signature into something the suite checks.
trybuild = "1"
