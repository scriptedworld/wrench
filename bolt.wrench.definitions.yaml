# Values the shared jigs substitute when they run at a pack's own base.
#
# wrench states one contract that every pack implements, so REQUIREMENTS.md and
# SUPPRESSIONS live at the repository root and not beside each pack. A relative
# value resolves against the base the child runs in, so one file serves every
# pack rather than one copy per base that could drift.
requirements: ../REQUIREMENTS.md
suppressions: ../SUPPRESSIONS
