# Values the shared jigs substitute when they run at a pack's own base.
#
# wrench states one contract that every pack implements, so the requirements and
# SUPPRESSIONS live at the repository root and not beside each pack. A relative
# value resolves against the base the child runs in, so one set serves every
# pack rather than one copy per base that could drift.
#
# A directory: `docs/REQUIREMENTS/<category>/FR-<id>-<slug>.md`, with retirement
# carried by a `.retired` name. Both checkers take a tree or a single file, so
# an adopter keeping one REQUIREMENTS.md is unaffected.
requirements: ../docs/REQUIREMENTS
suppressions: ../SUPPRESSIONS
